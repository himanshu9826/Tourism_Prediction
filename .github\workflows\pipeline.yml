
# Name displayed in the GitHub Actions tab
name: Tourism Project Pipeline

# Run automatically when code is pushed to main,
# or manually from the Actions tab.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow GitHub Actions to commit the trained model.
permissions:
  contents: write

jobs:

  # JOB 1: Validate and register the dataset
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      # Download the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install project dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      # Validate the dataset and generate its registration summary
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      # Pass the dataset to the next job
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # JOB 2: Prepare training and testing data
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      # Create train.csv and test.csv
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      # Upload the exact files generated by prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/processed/train.csv
            tourism_project/data/processed/test.csv

  # JOB 3: Train, evaluate, and save the model
  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tourism_project/requirements.txt

      # Download the data splits into the directory expected by train.py
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed/

      # Start MLflow locally for experiment tracking.
      # This is not a publicly hosted MLflow server.
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 127.0.0.1 --port 5000 \
            --backend-store-uri ./mlruns \
            > mlflow.log 2>&1 &
          sleep 5

      # Train and evaluate the model.
      # train.py must save best_model.joblib in tourism_project/deployment/
      - name: Model Building
        run: python tourism_project/model_building/train.py

      # Commit the trained model back to the repository.
      # The default GITHUB_TOKEN is used by checkout/push permissions.
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_model.joblib

          # Avoid failing when the model file has not changed
          if ! git diff --cached --quiet; then
            git commit -m "Update trained model [skip ci]"
            git push origin HEAD:main
          else
            echo "No changes to the trained model."
          fi
