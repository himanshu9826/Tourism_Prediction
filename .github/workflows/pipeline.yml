
name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py

      - name: Verify Dataset
        run: |
          test -f tourism_project/data/tourism.csv

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py

      - name: Verify Train and Test Files
        run: |
          test -f tourism_project/data/processed/train.csv
          test -f tourism_project/data/processed/test.csv

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data/processed/train.csv
            tourism_project/data/processed/test.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data/processed
          merge-multiple: true

      - name: Verify Downloaded Files
        run: |
          test -f tourism_project/data/processed/train.csv
          test -f tourism_project/data/processed/test.csv

      - name: Train and Evaluate Model
        run: python tourism_project/model_building/train.py

      - name: Verify Model Output
        run: |
          test -f tourism_project/deployment/best_model.joblib
          test -f tourism_project/deployment/evaluation_results.json

      - name: Commit Trained Model and Evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add tourism_project/deployment/best_model.joblib
          git add tourism_project/deployment/evaluation_results.json

          if git diff --cached --quiet; then
            echo "No model or evaluation changes to commit."
          else
            git commit -m "Update trained model and evaluation [skip ci]"
            git push origin HEAD:main
          fi
